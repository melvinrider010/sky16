<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon Links -->
    <link rel="icon" type="image/png" href="/images-sky-16/SKY-FAVICON.png" />
    <link rel="apple-touch-icon" href="/images-sky-16/SKY-FAVICON.png" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Sky16 Cafe & Retreat | Best Café & Destination in Coorg</title>
    <meta name="description" content="Welcome to Sky16 Cafe & Retreat, Coorg's premier café. Savor gourmet coffees, authentic mountain teas, Sky16 Monster Burgers, wood-fired pizzas, comforting bites, 50ft giant swings, and luxury chalets in a cozy, scenic atmosphere." />
    <meta name="keywords" content="cafe in Coorg, coffee shop Coorg, best cafe in Kushalnagar, restaurant in Coorg, Sky16 Cafe, Kaveri Nisargadhama cafe, wood-fired pizza Coorg, food delivery Coorg, Swiggy Zomato Coorg" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://skydinecoorg.com/" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sky16 Cafe & Retreat | Best Café & Destination in Coorg" />
    <meta property="og:description" content="Discover Coorg's premium cafe and destination retreat near Kaveri Nisargadhama. Savor fresh artisan coffees, authentic mountain teas, custom burgers, wood-fired pizzas, and high-altitude adventures." />
    <meta property="og:image" content="/images-sky-16/sky16-logo-official.png" />
    <meta property="og:site_name" content="Sky16 Cafe & Retreat" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Mystic Brew House Official Compiled Stylesheet -->
    <link rel="stylesheet" crossorigin href="/assets/mystic-tailwind.css" />

    <style>
      /* Enhanced Brand Logo with Radiant Glow Effect */
      @keyframes logoGlowPulse {
        0%, 100% {
          filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.85))
                  drop-shadow(0 0 20px rgba(234, 88, 12, 0.65))
                  drop-shadow(0 0 40px rgba(214, 90, 49, 0.45))
                  drop-shadow(0 0 70px rgba(226, 168, 80, 0.25))
                  brightness(1.22) contrast(1.15);
        }
        50% {
          filter: drop-shadow(0 0 14px rgba(249, 115, 22, 1))
                  drop-shadow(0 0 30px rgba(234, 88, 12, 0.85))
                  drop-shadow(0 0 55px rgba(214, 90, 49, 0.6))
                  drop-shadow(0 0 90px rgba(226, 168, 80, 0.4))
                  brightness(1.3) contrast(1.2);
        }
      }

      .brand-logo-img {
        height: 70px !important;
        max-height: 78px !important;
        width: auto !important;
        object-fit: contain !important;
        display: block !important;
        filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.4)) contrast(1.08) !important;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease !important;
      }
      .brand-logo-img:hover {
        transform: scale(1.04) !important;
        filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.9)) 
                drop-shadow(0 0 26px rgba(234, 88, 12, 0.65)) 
                brightness(1.2) contrast(1.15) !important;
      }
      @media (max-width: 640px) {
        .brand-logo-img {
          height: 52px !important;
          max-height: 58px !important;
        }
      }

      .brand-logo-footer {
        height: 88px !important;
        max-height: 96px !important;
        width: auto !important;
        object-fit: contain !important;
        display: block !important;
        animation: logoGlowPulse 4s ease-in-out infinite !important;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease !important;
        cursor: pointer;
      }
      .brand-logo-footer:hover {
        transform: scale(1.04) !important;
        filter: drop-shadow(0 0 18px rgba(249, 115, 22, 1))
                drop-shadow(0 0 38px rgba(234, 88, 12, 0.95))
                drop-shadow(0 0 70px rgba(214, 90, 49, 0.75))
                brightness(1.35) contrast(1.25) !important;
      }

      /* Adventure & Stay Structured Styling */
      .adventure-grid {
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 1.5rem;
      }
      @media (min-width: 768px) {
        .adventure-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .adventure-card {
        background: #25120a;
        border: 1px solid rgba(192, 130, 87, 0.25);
        border-radius: 1.25rem;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .adventure-card:hover {
        transform: translateY(-4px);
        border-color: rgba(192, 130, 87, 0.6);
        box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.5);
      }
      .adventure-card-img-wrap {
        height: 220px;
        width: 100%;
        overflow: hidden;
        position: relative;
      }
      .adventure-card-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .adventure-card:hover .adventure-card-img {
        transform: scale(1.06);
      }

      /* Stay Section Structured Layout */
      .stay-gallery-grid {
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 1.25rem;
      }
      @media (min-width: 768px) {
        .stay-gallery-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .stay-photo-card {
        border-radius: 1.25rem;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.1);
        height: 260px;
        background: #180b06;
      }
      .stay-photo-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .stay-photo-card:hover img {
        transform: scale(1.06);
      }
      .stay-amenities-grid {
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 1.25rem;
      }
      @media (min-width: 640px) {
        .stay-amenities-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      /* Interactive Pillar Showcase Accordion Layout (Image Reference) */
      .pillar-accordion-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 100%;
        min-height: 480px;
        border-radius: 2rem;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      @media (min-width: 768px) {
        .pillar-accordion-container {
          flex-direction: row;
          height: 540px;
          gap: 0;
        }
      }
      .pillar-panel {
        position: relative;
        overflow: hidden;
        cursor: pointer;
        transition: flex 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s ease;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      @media (min-width: 768px) {
        .pillar-panel.active {
          flex: 4.8;
          cursor: default;
        }
        .pillar-panel.collapsed {
          flex: 1.2;
        }
      }
      @media (max-width: 767px) {
        .pillar-panel.active {
          min-height: 380px;
          cursor: default;
        }
        .pillar-panel.collapsed {
          height: 76px;
        }
      }
      .pillar-watermark {
        position: absolute;
        top: 22%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Playfair Display', serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
        z-index: 1;
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      .pillar-watermark-outline {
        color: transparent;
        -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.18);
        font-size: clamp(3.5rem, 8vw, 6.5rem);
        line-height: 0.85;
      }
      .pillar-watermark-solid {
        color: rgba(255, 255, 255, 0.28);
        font-size: clamp(3.5rem, 8vw, 6.5rem);
        line-height: 0.85;
      }
      .pillar-product-img {
        position: absolute;
        top: 38%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-height: 250px;
        max-width: 85%;
        object-fit: contain;
        z-index: 2;
        transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
        filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.6));
      }
      .pillar-panel.collapsed .pillar-product-img {
        max-height: 140px;
        top: 50%;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.4)) grayscale(0.2);
      }
      .pillar-panel:hover .pillar-product-img {
        transform: translate(-50%, -52%) scale(1.05);
      }
      @media (max-width: 767px) {
        .pillar-panel.collapsed .pillar-product-img {
          display: none;
        }
      }

    </style>
  </head>
  <body class="bg-cafe-light text-cafe-dark font-sans overflow-x-hidden selection:bg-cafe-accent selection:text-cafe-light">
    
    <!-- React Root Mount -->
    <div id="root"></div>

    <!-- Main Mystic Brew House Application Bundle -->
    <script type="module" crossorigin src="/assets/sky16-app.js"></script>
  </body>
</html>
